<style>
/* Layout: one reading column; hymn numbers sit on dark "hymn board" tiles like in church; song view has a sticky bar with the view switch and the favourite star */
:root {
  --bg: #F4F7F6;
  --surface: #FFFFFF;
  --ink: #15232A;
  --ink-soft: #2E4048;
  --muted: #5A6B72;
  --line: #DCE4E2;
  --line-strong: #B9C7C4;
  --accent: #0B6B78;
  --accent-ink: #FFFFFF;
  --refrain: #E7F1EE;
  --chip: #EBF0EF;
  --board: #2B241E;
  --board-ink: #F3ECE0;
  --fav: #B7791F;
  --bad: #B3261E;
  --f-sw: "Literata", Georgia, "Times New Roman", serif;
  --f-ui: "Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --fs: 1;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0E1619; --surface: #142126; --ink: #E3ECEC; --ink-soft: #C3D1D2; --muted: #93A5AA;
    --line: #23343A; --line-strong: #375058; --accent: #5BC0CB; --accent-ink: #0B1518;
    --refrain: #15292C; --chip: #1A2B30; --board: #3A3128; --board-ink: #F3ECE0;
    --fav: #E3B341; --bad: #F2B8B5;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0E1619; --surface: #142126; --ink: #E3ECEC; --ink-soft: #C3D1D2; --muted: #93A5AA;
  --line: #23343A; --line-strong: #375058; --accent: #5BC0CB; --accent-ink: #0B1518;
  --refrain: #15292C; --chip: #1A2B30; --board: #3A3128; --board-ink: #F3ECE0;
  --fav: #E3B341; --bad: #F2B8B5;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-ui); font-size: 16px; line-height: 1.5; margin: 0; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface); }
a { color: var(--accent); }
.gut {
  width: 100%; max-width: calc(42rem + 32px); margin-inline: auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
button { font: inherit; color: inherit; }

/* Header */
.top { padding-block: 1.1rem .6rem; display: flex; flex-direction: column; gap: .75rem; }
.brand-row { display: flex; align-items: center; justify-content: space-between; gap: .75rem; }
.brand h1 { font-family: var(--f-sw); font-size: 1.45rem; font-weight: 600; margin: 0; line-height: 1.2; text-wrap: balance; }
.brand p { margin: .1rem 0 0; font-size: .85rem; color: var(--muted); }
.fs-tools { display: flex; gap: .35rem; flex-shrink: 0; }
.fsb { font-size: .85rem; min-width: 2.4rem; height: 2.2rem; border: 1px solid var(--line-strong); background: var(--surface); color: var(--ink); border-radius: 8px; cursor: pointer; }
.search input {
  width: 100%; font: inherit; font-size: 1rem; padding: .7rem .9rem; border-radius: 10px;
  border: 1px solid var(--line-strong); background: var(--surface); color: var(--ink);
}
.search input::placeholder { color: var(--muted); }
.tabs { display: flex; gap: 1.2rem; border-bottom: 1px solid var(--line); }
.tabs a { text-decoration: none; color: var(--muted); font-weight: 700; font-size: .95rem; padding: .45rem 0 .55rem; border-bottom: 2px solid transparent; margin-bottom: -1px; }
.tabs a[aria-current="page"] { color: var(--ink); border-bottom-color: var(--accent); }
.hint { font-size: .85rem; color: var(--muted); margin: .9rem 0 .3rem; }
.sec { font-size: .74rem; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin: 1.2rem 0 0; }

/* Hymn board numbers */
.board {
  font-family: var(--f-sw); font-variant-numeric: lining-nums tabular-nums; font-weight: 600;
  background: var(--board); color: var(--board-ink); border-radius: 6px;
  display: grid; place-items: center; line-height: 1;
}
.board.sm { width: 3.3rem; height: 2.7rem; font-size: 1.3rem; }
.board.lg { min-width: 4.8rem; height: 3.8rem; padding: 0 .55rem; font-size: 2.1rem; flex-shrink: 0; }

/* Song list */
.list { display: flex; flex-direction: column; }
.list.last { padding-bottom: 2.5rem; }
.row {
  display: grid; grid-template-columns: 3.3rem 1fr auto; gap: .85rem; align-items: start;
  padding-block: .8rem; border-bottom: 1px solid var(--line); color: inherit; text-decoration: none;
}
.row:hover .t { color: var(--accent); }
.rt { min-width: 0; display: flex; flex-direction: column; gap: .05rem; }
.rt .t { font-family: var(--f-sw); font-size: 1.1rem; font-weight: 600; line-height: 1.3; }
.rt .e { font-size: .85rem; color: var(--muted); font-style: italic; }
.rt .meta { font-size: .78rem; color: var(--muted); }
.rt .snip { font-size: .85rem; color: var(--ink-soft); margin-top: .2rem; overflow-wrap: anywhere; }
.rt .snip mark { background: var(--refrain); color: var(--ink); border-radius: 3px; padding: 0 .1em; }
.rx { display: flex; flex-direction: column; align-items: flex-end; gap: .3rem; margin-top: .2rem; }
.pill { font-size: .72rem; font-weight: 700; letter-spacing: .03em; color: var(--muted); border: 1px solid var(--line-strong); border-radius: 6px; padding: .1rem .4rem; white-space: nowrap; }
.star { width: 1rem; height: 1rem; fill: var(--fav); }
.empty { padding-block: 1.5rem; color: var(--muted); }

/* Song bar */
.songbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--surface); border-bottom: 1px solid var(--line); }
.songbar-in { display: flex; align-items: center; gap: .45rem; padding-block: .5rem; }
.back { text-decoration: none; font-weight: 700; font-size: .92rem; white-space: nowrap; padding: .35rem .1rem; }
.seg { display: inline-flex; border: 1px solid var(--line-strong); border-radius: 8px; overflow: hidden; margin-left: auto; min-width: 0; }
.seg button { font-size: .84rem; padding: .42rem .55rem; background: transparent; border: 0; cursor: pointer; white-space: nowrap; }
.seg button + button { border-left: 1px solid var(--line-strong); }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); font-weight: 700; }
.favbtn { width: 2.2rem; height: 2.1rem; flex-shrink: 0; border: 1px solid var(--line-strong); background: transparent; border-radius: 8px; display: grid; place-items: center; cursor: pointer; color: var(--muted); }
.favbtn svg { width: 1.15rem; height: 1.15rem; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linejoin: round; }
.favbtn[aria-pressed="true"] { color: var(--fav); }
.favbtn[aria-pressed="true"] svg { fill: currentColor; }

/* Song */
.song { padding-block: 1.1rem 0; }
.song-head { display: flex; align-items: center; gap: .9rem; }
.song-titles { min-width: 0; }
.song-titles h1 { font-family: var(--f-sw); font-size: 1.45rem; font-weight: 600; line-height: 1.2; margin: 0; text-wrap: balance; }
.song-titles .en { margin: .25rem 0 0; color: var(--muted); font-style: italic; font-size: .92rem; }
.note { background: var(--chip); border-radius: 8px; padding: .55rem .75rem; font-size: .88rem; color: var(--ink-soft); margin: .9rem 0 0; }
.tools { display: flex; align-items: center; justify-content: flex-end; gap: .35rem; margin-top: .8rem; }
.tools span { font-size: .8rem; color: var(--muted); margin-right: .15rem; }
.tools .fsb { min-width: 2.2rem; height: 2rem; }
.kurz { margin-top: .4rem; }
.kurz summary { cursor: pointer; font-size: .75rem; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); padding-block: .2rem; }
.chips { display: flex; flex-wrap: wrap; gap: .35rem; margin-top: .4rem; }

.k b { font-family: var(--f-sw); color: var(--ink); font-weight: 600; margin-right: .2rem; }
.pane { margin-top: .6rem; }

.verse.refrain + .verse { border-top: 0; }
.vlabel { font-size: .74rem; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--accent); margin-bottom: .4rem; }
.ln + .ln { margin-top: .6rem; }
.sw { font-family: var(--f-sw); font-size: calc(1.06rem * var(--fs)); line-height: 1.35; font-weight: 600; margin: 0; }
.gl { margin: .1rem 0 0; font-size: calc(.97rem * var(--fs)); line-height: 1.45; color: var(--ink-soft); overflow-wrap: anywhere; }
.gs { color: var(--ink); font-weight: 700; }
.dot { color: var(--line-strong); }
.de { font-family: var(--f-sw); font-size: calc(1.06rem * var(--fs)); line-height: 1.5; margin: 0; }
.cue { display: inline-block; margin-top: .55rem; font-size: .8rem; font-weight: 700; color: var(--accent); background: transparent; border: 1px dashed var(--line-strong); border-radius: 6px; padding: .2rem .6rem; cursor: pointer; }
.song[data-mode="wfw"] .pane-sinn, .song[data-mode="sw"] .pane-sinn, .song[data-mode="sinn"] .pane-wfw { display: none; }

.song[data-mode="sw"] .ln + .ln { margin-top: .2rem; }
.song[data-mode="sw"] .sw { font-size: calc(1.16rem * var(--fs)); font-weight: 400; line-height: 1.5; }
.pn { display: flex; justify-content: space-between; gap: 1rem; margin-top: 1rem; padding-block: 1.2rem 2.8rem; border-top: 1px solid var(--line); }
.pn a { min-width: 0; max-width: 48%; text-decoration: none; font-size: .9rem; font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* Vocab */

.vsec .sub { font-size: .85rem; color: var(--muted); margin: 0 0 .3rem; }
.letter { font-family: var(--f-sw); font-weight: 600; color: var(--accent); font-size: 1rem; padding-top: .9rem; padding-bottom: .1rem; }
.vl { margin: 0; }
.vrow { display: grid; grid-template-columns: minmax(6.5rem, 38%) 1fr; gap: .75rem; padding-block: .45rem; border-bottom: 1px solid var(--line); }
.vrow dt { font-family: var(--f-sw); font-weight: 600; font-size: calc(1rem * var(--fs)); overflow-wrap: anywhere; min-width: 0; }

.vrow dd { margin: 0; font-size: calc(.95rem * var(--fs)); min-width: 0; }
.occ { display: flex; flex-wrap: wrap; gap: .3rem; margin-top: .3rem; }

.vend { padding-bottom: 2.5rem; }

/* Lock */
.lock { padding-block: 2.2rem; display: flex; flex-direction: column; gap: .8rem; max-width: 26rem; }

.lock p { margin: 0; color: var(--ink-soft); }
.lock label { font-size: .85rem; font-weight: 700; margin-top: .4rem; }
.lock input { font: inherit; font-size: 1rem; padding: .7rem .9rem; border-radius: 10px; border: 1px solid var(--line-strong); background: var(--surface); color: var(--ink); }
.lock button { background: var(--accent); color: var(--accent-ink); border: 0; border-radius: 10px; padding: .75rem 1rem; font-weight: 700; cursor: pointer; }
.lock .err { color: var(--bad); min-height: 1.5em; font-size: .92rem; }

<script>
(function () {
  var view = document.getElementById('view');
  var header = document.getElementById('top');
  var qEl = document.getElementById('q');
  var SONGS = [], VOCAB = [], byNum = {};
  var STAR = '<path d="M12 3.6l2.6 5.3 5.8.8-4.2 4.1 1 5.8L12 16.9l-5.2 2.7 1-5.8-4.2-4.1 5.8-.8z"/>';

  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  function norm(s) {
    return String(s).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '')
      .replace(/[-‐'’]/g, '').replace(/[^a-z0-9ß\s]/g, ' ').replace(/\s+/g, ' ').trim();
  }
  var store = {
    get: function (k, d) { try { var v = localStorage.getItem('lb-' + k); return v === null ? d : v; } catch (e) { return d; } },
    set: function (k, v) { try { localStorage.setItem('lb-' + k, v); } catch (e) {} }
  };

  /* Favourites */
  var favs = {};
  try { JSON.parse(store.get('fav', '[]')).forEach(function (n) { favs[String(n)] = 1; }); } catch (e) { favs = {}; }
  function isFav(n) { return !!favs[String(n)]; }
  function toggleFav(n) {
    n = String(n);
    if (favs[n]) delete favs[n]; else favs[n] = 1;
    store.set('fav', JSON.stringify(Object.keys(favs)));
    return !!favs[n];
  }

  /* Font size */
  var STEPS = [0.9, 1, 1.12, 1.26, 1.42];
  var fsIdx = parseInt(store.get('fs', '1'), 10);
  if (!(fsIdx >= 0 && fsIdx < STEPS.length)) fsIdx = 1;
  function applyFs() { document.documentElement.style.setProperty('--fs', STEPS[fsIdx]); }
  applyFs();
  document.addEventListener('click', function (ev) {
    var b = ev.target.closest('[data-fs]');
    if (!b) return;
    fsIdx = Math.max(0, Math.min(STEPS.length - 1, fsIdx + parseInt(b.getAttribute('data-fs'), 10)));
    store.set('fs', String(fsIdx));
    applyFs();
  });

  /* Keep screen on while a song is open */
  var wake = null;
  function requestWake() {
    try {
      if ('wakeLock' in navigator && document.visibilityState === 'visible') {
        navigator.wakeLock.request('screen').then(function (w) { wake = w; }).catch(function () {});
      }
    } catch (e) {}
  }
  function releaseWake() { try { if (wake) wake.release(); } catch (e) {} wake = null; }
  document.addEventListener('visibilitychange', function () {
    if (document.visibilityState === 'visible' && /^#lied-/.test(location.hash)) requestWake();
  });

  function buildIndex() {
    SONGS.forEach(function (s) {
      byNum[String(s.num)] = s;
      var parts = [s.num, s.title, s.en];
      s.lineIdx = [];
      s.verses.forEach(function (v) {
        v.lines.forEach(function (l) {
          var g = l.gloss.map(function (x) { return x.sw + ' ' + x.de; }).join(' ');
          parts.push(l.sw, g);
          s.lineIdx.push({ text: l.sw, n: norm(l.sw + ' ' + g) });
        });
      });
      Object.keys(s.meaning).forEach(function (k) {
        s.meaning[k].forEach(function (t) { parts.push(t); s.lineIdx.push({ text: t, n: norm(t) }); });
      });
      s.hay = norm(parts.join(' '));
      s.titleN = norm(s.title + ' ' + s.en);
      s.incomplete = /^Bisher nur/.test(s.note || '');
      s.hasRefrain = s.verses.some(function (v) { return v.label === 'R'; });
      s.stanzas = s.verses.filter(function (v) { return v.label !== 'R'; }).map(function (v) { return v.label; });
    });
    VOCAB.forEach(function (e) { e.n = norm(e.sw + ' ' + e.de); });
  }

  function tokens() { var q = norm(qEl.value); return q ? q.split(' ') : []; }
  function stanzaText(s) {
    if (s.incomplete) return 'bisher Str. ' + s.stanzas.join('–');
    return s.stanzas.length + ' Strophen' + (s.hasRefrain ? ' · Refrain' : '');
  }
  function markText(text, raw) {
    var t = esc(text);
    var words = raw.trim().split(/\s+/).filter(function (w) { return w.length > 1 && !/^\d+$/.test(w); });
    words.forEach(function (w) {
      var re = new RegExp('(' + esc(w).replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ')', 'ig');
      t = t.replace(re, '<mark>$1</mark>');
    });
    return t;
  }
  function setTab(name) {
    document.getElementById('tab-lieder').setAttribute('aria-current', name === 'lieder' ? 'page' : 'false');
    document.getElementById('tab-vokabeln').setAttribute('aria-current', name === 'vokabeln' ? 'page' : 'false');
  }

  /* Song list */
  var listScroll = 0;
  function matchSongs() {
    var raw = qEl.value.trim();
    if (!raw) return { songs: SONGS, raw: raw };
    if (/^\d+$/.test(raw)) {
      return { songs: SONGS.filter(function (s) { return String(s.num).indexOf(raw) === 0; }), raw: raw, num: true };
    }
    var toks = tokens();
    return { songs: SONGS.filter(function (s) { return toks.every(function (t) { return s.hay.indexOf(t) >= 0; }); }), raw: raw };
  }
  function rowHtml(s, snip) {
    return '<a class="row" href="#lied-' + s.num + '">' +
      '<span class="board sm">' + s.num + '</span>' +
      '<span class="rt"><span class="t">' + esc(s.title) + '</span>' +
      (s.en ? '<span class="e">' + esc(s.en) + '</span>' : '') +
      '<span class="meta">' + stanzaText(s) + '</span>' + (snip || '') + '</span>' +
      '<span class="rx">' + (isFav(s.num) ? '<svg class="star" viewBox="0 0 24 24" role="img" aria-label="Favorit">' + STAR + '</svg>' : '') +
      (s.incomplete ? '<span class="pill">unvollständig</span>' : '') + '</span></a>';
  }
  function renderList() {
    var m = matchSongs();
    var toks = tokens();
    var html = '';
    if (!m.raw) {
      var favSongs = SONGS.filter(function (s) { return isFav(s.num); });
      if (favSongs.length) {
        html += '<p class="sec">Favoriten</p><div class="list">' + favSongs.map(function (s) { return rowHtml(s); }).join('') + '</div>';
        html += '<p class="sec">Alle Lieder</p>';
      } else {
        html += '<p class="hint">Lied antippen. Oben im Lied umschalten zwischen <b>Suaheli</b>, <b>Wörtlich</b> und <b>Sinngemäß</b>. Mit dem Stern merkst du dir Lieder als Favoriten.</p>';
      }
    }
    if (!m.songs.length) {
      html += '<p class="empty">Nichts gefunden für „' + esc(m.raw) + '“. Suche nach einer Liednummer, einem Suaheli-Wort oder einem deutschen Wort. Unter „Vokabeln“ findest du einzelne Wörter.</p>';
    }
    html += '<div class="list last">';
    m.songs.forEach(function (s) {
      var snip = '';
      if (m.raw && !m.num && !toks.every(function (t) { return s.titleN.indexOf(t) >= 0; })) {
        var hit = s.lineIdx.filter(function (l) { return toks.every(function (t) { return l.n.indexOf(t) >= 0; }); })[0];
        if (hit) snip = '<span class="snip">' + markText(hit.text, m.raw) + '</span>';
      }
      html += rowHtml(s, snip);
    });
    html += '</div>';
    view.innerHTML = '<div class="gut">' + html + '</div>';
  }
  function showList() {
    releaseWake();
    header.hidden = false;
    setTab('lieder');
    renderList();
    window.scrollTo(0, listScroll);
  }

  /* Song view */
  var MODES = ['sw', 'wfw', 'sinn'];
  function glossHtml(l) {
    return l.gloss.map(function (g) {
      return g.sw ? '<span class="g"><span class="gs">' + esc(g.sw) + '</span> = ' + esc(g.de) + '</span>'
                  : '<span class="g">' + esc(g.de) + '</span>';
    }).join('<span class="dot"> · </span>');
  }
  function verseHtml(s, v, pane) {
    var isR = v.label === 'R';
    var label = isR ? 'Refrain' : 'Strophe ' + v.label;
    var body;
    if (pane === 'wfw') {
      body = v.lines.map(function (l) {
        return '<div class="ln"><p class="sw">' + esc(l.sw) + '</p><p class="gl">' + glossHtml(l) + '</p></div>';
      }).join('');
    } else {
      body = (s.meaning[v.label] || []).map(function (t) { return '<p class="de">' + esc(t) + '</p>'; }).join('');
    }
    var cue = (s.hasRefrain && !isR && v.label !== '1') ?
      '<button type="button" class="cue" data-jump="ref-' + pane + '">↻ Refrain</button>' : '';
    return '<section class="verse' + (isR ? ' refrain' : '') + '"' + (isR ? ' id="ref-' + pane + '"' : '') + '>' +
      '<div class="vlabel">' + label + '</div>' + body + cue + '</section>';
  }
  function showSong(s) {
    if (!header.hidden) listScroll = window.scrollY;
    header.hidden = true;
    var i = SONGS.indexOf(s), prev = SONGS[i - 1], next = SONGS[i + 1];
    var mode = store.get('mode', 'wfw');
    if (MODES.indexOf(mode) < 0) mode = 'wfw';
    function segBtn(m, label) {
      return '<button type="button" data-mode="' + m + '" aria-pressed="' + (mode === m) + '">' + label + '</button>';
    }
    var kurz = s.kurz.length ? '<details class="kurz" open><summary>Grammatik-Kürzel</summary><div class="chips">' +
      s.kurz.map(function (k) { return '<span class="k"><b>' + esc(k.sw) + '</b>' + esc(k.de || '') + '</span>'; }).join('') +
      '</div></details>' : '';
    view.innerHTML =
      '<div class="songbar"><div class="gut songbar-in">' +
        '<a class="back" href="#">← Alle</a>' +
        '<div class="seg" role="group" aria-label="Ansicht">' + segBtn('sw', 'Suaheli') + segBtn('wfw', 'Wörtlich') + segBtn('sinn', 'Sinngemäß') + '</div>' +
        '<button type="button" class="favbtn" id="favbtn" aria-pressed="' + isFav(s.num) + '" aria-label="Als Favorit merken"><svg viewBox="0 0 24 24" aria-hidden="true">' + STAR + '</svg></button>' +
      '</div></div>' +
      '<article class="gut song" data-mode="' + mode + '">' +
        '<div class="song-head"><div class="board lg" aria-label="Lied ' + s.num + '">' + s.num + '</div>' +
        '<div class="song-titles"><h1>' + esc(s.title) + '</h1>' + (s.en ? '<p class="en">' + esc(s.en) + '</p>' : '') + '</div></div>' +
        (s.note ? '<p class="note">' + esc(s.note) + '</p>' : '') +
        '<div class="tools"><span>Schrift</span><button type="button" class="fsb" data-fs="-1" aria-label="Schrift kleiner">A−</button>' +
        '<button type="button" class="fsb" data-fs="1" aria-label="Schrift größer">A+</button></div>' + kurz +
        '<div class="pane pane-wfw">' + s.verses.map(function (v) { return verseHtml(s, v, 'wfw'); }).join('') + '</div>' +
        '<div class="pane pane-sinn">' + s.verses.map(function (v) { return verseHtml(s, v, 'sinn'); }).join('') + '</div>' +
        '<nav class="pn" aria-label="Weitere Lieder">' +
          (prev ? '<a class="prev" href="#lied-' + prev.num + '">← ' + prev.num + ' ' + esc(prev.title) + '</a>' : '<span></span>') +
          (next ? '<a class="next" href="#lied-' + next.num + '">' + next.num + ' ' + esc(next.title) + ' →</a>' : '') +
        '</nav>' +
      '</article>';
    window.scrollTo(0, 0);
    var art = view.querySelector('.song');
    view.querySelectorAll('.seg button').forEach(function (b) {
      b.addEventListener('click', function () {
        var m = b.getAttribute('data-mode');
        art.setAttribute('data-mode', m);
        store.set('mode', m);
        view.querySelectorAll('.seg button').forEach(function (o) { o.setAttribute('aria-pressed', String(o === b)); });
      });
    });
    var fb = document.getElementById('favbtn');
    fb.addEventListener('click', function () { fb.setAttribute('aria-pressed', String(toggleFav(s.num))); });
    view.querySelectorAll('.cue').forEach(function (c) {
      c.addEventListener('click', function () {
        var t = document.getElementById(c.getAttribute('data-jump'));
        if (t) t.scrollIntoView({ block: 'center' });
      });
    });
    requestWake();
  }

  /* Vocab */
  function occHtml(e) {
    if (!e.songs || !e.songs.length) return '';
    var max = 12, h = '<div class="occ">';
    e.songs.slice(0, max).forEach(function (n) { h += '<a href="#lied-' + n + '" aria-label="Lied ' + n + '">' + n + '</a>'; });
    if (e.songs.length > max) h += '<span class="more">+' + (e.songs.length - max) + '</span>';
    return h + '</div>';
  }
  function renderVocab() {
    var toks = tokens();
    var hits = VOCAB.filter(function (e) { return toks.every(function (t) { return e.n.indexOf(t) >= 0; }); });
    var words = hits.filter(function (e) { return !e.verb; });
    var verbs = hits.filter(function (e) { return e.verb; }).sort(function (a, b) {
      return a.sw.replace(/^ku/, '').localeCompare(b.sw.replace(/^ku/, ''));
    });
    var html = '<p class="vcount">' + (toks.length ? hits.length + ' Treffer' : VOCAB.length + ' Wörter aus den Liedern') +
      '. Die Zahlen zeigen, in welchen Liedern ein Wort vorkommt.</p>';
    if (!hits.length) html += '<p class="empty">Kein Wort gefunden. Probier die Grundform, zum Beispiel „ona“ statt „tutawaona“.</p>';
    if (words.length) {
      html += '<section class="vsec"><h2>Wörter</h2><dl class="vl">';
      var last = '';
      words.forEach(function (e) {
        var L = e.sw.replace(/^-/, '').charAt(0).toUpperCase();
        if (L !== last) { html += '<div class="letter">' + esc(L) + '</div>'; last = L; }
        html += '<div class="vrow"><dt>' + esc(e.sw) + '</dt><dd>' + esc(e.de) + occHtml(e) + '</dd></div>';
      });
      html += '</dl></section>';
    }
    if (verbs.length) {
      html += '<section class="vsec"><h2>Verben</h2><p class="sub">Nach Wortstamm sortiert. Im Lied fällt „ku-“ weg: ku<b>ona</b> → tuta<b>ona</b>.</p><dl class="vl">';
      verbs.forEach(function (e) {
        var parts = e.sw.split(' / ').map(function (p) {
          return /^ku/.test(p) ? '<span class="ku">ku</span>' + esc(p.slice(2)) : esc(p);
        }).join(' / ');
        html += '<div class="vrow"><dt>' + parts + '</dt><dd>' + esc(e.de) + occHtml(e) + '</dd></div>';
      });
      html += '</dl></section>';
    }
    view.innerHTML = '<div class="gut vend">' + html + '</div>';
  }
  function showVocab() {
    releaseWake();
    if (!header.hidden) listScroll = window.scrollY;
    header.hidden = false;
    setTab('vokabeln');
    renderVocab();
  }

  /* Routing */
  function route() {
    var h = decodeURIComponent(location.hash.replace(/^#/, ''));
    var m = /^lied-(\d+)$/.exec(h);
    if (m && byNum[m[1]]) return showSong(byNum[m[1]]);
    if (h === 'vokabeln') return showVocab();
    showList();
  }
  function start(DATA) {
    SONGS = DATA.songs; VOCAB = DATA.vocab;
    buildIndex();
    document.getElementById('sub').textContent = SONGS.length + ' Lieder · Wort für Wort · sinngemäß';
    qEl.addEventListener('input', function () {
      listScroll = 0;
      if (location.hash === '#vokabeln') renderVocab(); else renderList();
    });
    qEl.addEventListener('keydown', function (ev) {
      if (ev.key !== 'Enter' || location.hash === '#vokabeln') return;
      var raw = qEl.value.trim();
      if (/^\d+$/.test(raw) && byNum[raw]) { location.hash = 'lied-' + raw; return; }
      var m = matchSongs();
      if (m.songs.length === 1) location.hash = 'lied-' + m.songs[0].num;
    });
    window.addEventListener('hashchange', route);
    route();
  }

  /* Private copy: song data is encrypted, unlocked once per device */
  function b64(s) { var b = atob(s), a = new Uint8Array(b.length); for (var i = 0; i < b.length; i++) a[i] = b.charCodeAt(i); return a; }
  function decrypt(pw, e) {
    return crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey'])
      .then(function (k) {
        return crypto.subtle.deriveKey({ name: 'PBKDF2', salt: b64(e.salt), iterations: e.iter, hash: 'SHA-256' }, k,
          { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
      })
      .then(function (key) { return crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64(e.iv) }, key, b64(e.ct)); })
      .then(function (buf) { return JSON.parse(new TextDecoder().decode(buf)); });
  }
  function showLock(enc, msg) {
    header.hidden = true;
    view.innerHTML = '<div class="gut"><form class="lock" id="lockform">' +
      '<h1>Suaheli-Liederbuch</h1>' +
      '<p>Dieses Liederbuch ist privat. Gib einmal das Passwort ein, danach öffnet es sich auf diesem Gerät von selbst.</p>' +
      '<label for="pw">Passwort</label>' +
      '<input id="pw" type="password" autocomplete="current-password" autocapitalize="off" autocorrect="off" spellcheck="false">' +
      '<button type="submit" id="lockbtn">Öffnen</button>' +
      '<p class="err" id="lockerr" role="alert">' + esc(msg || '') + '</p></form></div>';
    document.getElementById('lockform').addEventListener('submit', function (ev) {
      ev.preventDefault();
      tryUnlock(enc, document.getElementById('pw').value.trim(), false);
    });
  }
  function tryUnlock(enc, pw, silent) {
    if (!(window.crypto && crypto.subtle)) {
      showLock(enc, 'Dieser Browser kann das Liederbuch nicht entschlüsseln. Öffne die Seite über https in Safari oder Chrome.');
      return;
    }
    decrypt(pw, enc).then(function (DATA) { store.set('pw', pw); start(DATA); })
      .catch(function () {
        if (silent) { showLock(enc, ''); return; }
        var err = document.getElementById('lockerr');
        if (err) err.textContent = 'Das Passwort stimmt nicht. Achte auf Groß- und Kleinschreibung.';
      });
  }

  var encEl = document.getElementById('lb-enc');
  if (encEl) {
    var enc = JSON.parse(encEl.textContent);
    var saved = store.get('pw', '');
    if (saved) tryUnlock(enc, saved, true); else showLock(enc, '');
  } else {
    start(JSON.parse(document.getElementById('lb-data').textContent));
  }
  if (document.querySelector('link[rel="manifest"]') && 'serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js').catch(function () {});
  }
})();
</script>

</body>
</html>
